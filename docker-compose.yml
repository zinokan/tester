version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zenni-postgres
    environment:
      POSTGRES_DB: zenni_db
      POSTGRES_USER: zenni_user
      POSTGRES_PASSWORD: zenni_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - zenni-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: zenni-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zenni-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zenni-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zenni_user:zenni_password@postgres:5432/zenni_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - zenni-network

  # Frontend Web App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: zenni-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - zenni-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zenni-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - zenni-network

volumes:
  postgres_data:
  redis_data:

networks:
  zenni-network:
    driver: bridge